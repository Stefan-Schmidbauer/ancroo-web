<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ancroo Web &mdash; Opening the Chrome Web Store</title>
    <link
      rel="canonical"
      href="https://chromewebstore.google.com/detail/ancroo/jeaaomlligaaoohplachpimjgopjmfim"
    />
    <!-- Transparent redirect: shows this page, then forwards after a short delay.
         Meta-refresh is the no-JS fallback; the button lets people go instantly. -->
    <meta
      http-equiv="refresh"
      content="3; url=https://chromewebstore.google.com/detail/ancroo/jeaaomlligaaoohplachpimjgopjmfim"
    />
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1f2933;
        --muted: #6b7280;
        --accent: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        padding: 20px;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 28px;
        max-width: 420px;
        width: 100%;
        text-align: center;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 14px;
        margin: 0 0 20px;
      }
      p.dest {
        font-size: 13px;
        margin: 0 0 20px;
        word-break: break-all;
      }
      p.dest span {
        color: var(--text);
      }
      a.btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 20px;
        border-radius: 8px;
        border: 1px solid var(--accent);
      }
      a.btn:hover {
        background: #1d4ed8;
      }
      a.btn svg {
        width: 16px;
        height: 16px;
      }
      .fallback {
        margin: 18px 0 0;
        font-size: 12px;
      }
      .fallback a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Opening the Chrome Web Store&hellip;</h1>
      <p>
        You&rsquo;re being redirected to the official Chrome Web Store page to install
        <strong>Ancroo Web</strong>.
      </p>
      <p class="dest">Destination: <span>chromewebstore.google.com/detail/ancroo</span></p>
      <a
        class="btn"
        href="https://chromewebstore.google.com/detail/ancroo/jeaaomlligaaoohplachpimjgopjmfim"
      >
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path
            d="M12 3a9 9 0 0 1 7.79 4.5H12a4.5 4.5 0 0 0-4.373 3.44L4.2 5.03A8.98 8.98 0 0 1 12 3Zm9 9a9 9 0 0 1-9 9l3.9-6.75A4.48 4.48 0 0 0 16.5 12a4.48 4.48 0 0 0-.6-2.25h7.79c.2.72.31 1.47.31 2.25Zm-9 4.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9ZM3 12c0-1.36.3-2.65.84-3.8l3.9 6.75A4.49 4.49 0 0 0 11.1 20.9 9 9 0 0 1 3 12Z"
            fill="currentColor"
          />
        </svg>
        Continue to the store now
      </a>
      <p class="fallback">
        Not redirected automatically?
        <a href="https://chromewebstore.google.com/detail/ancroo/jeaaomlligaaoohplachpimjgopjmfim"
          >Open it manually</a
        >.
      </p>
    </div>
  </body>
</html>
